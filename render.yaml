# ============================================================
# Render — Blueprint para publicar el BACKEND (gratis, free tier).
#
# Cómo publicar:
#   1. Subir el proyecto a GitHub.
#   2. En dashboard.render.com: "New" -> "Blueprint".
#   3. Elegir el repo. Render lee este archivo solo y crea el servicio.
#
# El FRONTEND va en Netlify (ver frontend/netlify.toml).
# ============================================================
services:
  - type: web
    name: nexus-ops-ai-backend
    runtime: python
    # La app arranca desde backend/ (ahi esta api.py)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render pone el puerto en la variable $PORT; hay que escuchar en 0.0.0.0
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/estado
    autoDeploy: true
    plan: free
    envVars:
      # El CEREBRO corre en Nebius Token Factory con el router Nemotron. La semilla
      # de los 6 meses precargados usa el motor local igual (ver api.py), así el
      # arranque es en segundos; Nebius se usa en todo lo EN VIVO: la Sala de
      # Agentes, las reuniones del gerente y la llamada en vivo.
      # LLM_API_KEY se carga a mano desde el panel de Render (nunca se commitea).
      - key: USE_MOCK
        value: "false"
      # Nebius Token Factory: endpoint compatible con OpenAI.
      - key: LLM_BASE_URL
        value: "https://api.tokenfactory.nebius.com/v1"
      # Router: razonamiento al modelo grande, volumen diario al liviano.
      - key: LLM_MODEL_REASONING
        value: "nvidia/Nemotron-3.5-Super-VL"
      - key: LLM_MODEL_FAST
        value: "nvidia/Nemotron-3_5-Lightning"
      # LLM_API_KEY y LLM_MODEL NO se listan acá a propósito: se cargan a mano
      # desde el panel de Render (Environment), así la clave nunca se commitea.
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: LLM_TIMEOUT_S
        value: "90"
      # NEXUS_DB queda sin definir a propósito: la base se crea en backend/data/
      # dentro del repo, que sí es escribible en el plan gratis de Render.
