# nginx: sirve el build de Vite y hace de proxy del backend.
# Usado por docker compose (servicio "frontend") y por la imagen standalone.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---------------------------------------------------------
    # API -> backend FastAPI (servicio "backend" en docker compose)
    # Ojo: proxy_pass SIN barra final => conserva el prefijo /api/
    # ---------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La simulación de 6 meses puede tardar: no cortar la conexión
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------------------------------------------------
    # Estáticos del build de Vite (con cache para los hash-named)
    # ---------------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
