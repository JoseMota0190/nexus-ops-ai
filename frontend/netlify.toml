# ============================================================
# Netlify — hosting del frontend (gratis).
#
# Cómo publicar:
#   1. Subo el proyecto a GitHub.
#   2. En app.netlify.com: "Add new site" -> "Import an existing project".
#   3. Elego el repo y pongo como base directory  `frontend`.
#   4. Netlify lee este archivo solo y arma el sitio.
#
# IMPORTANTE: el frontend NO pasa por un proxy de Netlify para hablar con
# el backend. Va directo a Render (ver VITE_API_URL abajo). Probamos que el
# proxy de Netlify rewriteaba mal la URL del backend (404) y que Render SÍ
# acepta pedidos directos de nexus-ops-ai.netlify.app (CORS OK, probado con
# preflight). Ir directo es un salto menos y se evita ese problema.
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

# Cualquier otra ruta cae en la SPA (index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # URL DIRECTA del backend en Render: así el navegador le habla a la API
  # sin pasar por el proxy de Netlify (que rompía el camino del pedido).
  VITE_API_URL = "https://nexus-ops-ai-backend.onrender.com"
